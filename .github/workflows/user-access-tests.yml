name: StayLedger User Access Tests

on:
  push:
    branches: [Kulara]
    paths:
      - 'backend/laravel/**'
      - 'frontend/**'
      - '.github/workflows/user-access-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-user-access:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, curl, xml, pdo_sqlite, sqlite3, pdo_pgsql, pgsql
          tools: composer:v2
          coverage: none

      - name: Install Laravel dependencies
        working-directory: backend/laravel
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Generate test app key
        working-directory: backend/laravel
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run isolated database tests
        working-directory: backend/laravel
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          SESSION_DRIVER: array
          CACHE_STORE: array
        run: php artisan test

  frontend-build:
    name: React production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts
      - name: Build frontend
        working-directory: frontend
        run: npm run build
