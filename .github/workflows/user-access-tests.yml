name: StayLedger User Access Tests

on:
  push:
    branches: [Kulara, main]
    paths:
      - 'backend/laravel/**'
      - 'frontend/**'
      - '.github/workflows/user-access-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-user-access:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, curl, xml, pdo_sqlite, sqlite3, pdo_pgsql, pgsql
          tools: composer:v2
          coverage: none

      - name: Install Laravel dependencies
        working-directory: backend/laravel
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Generate test app key
        working-directory: backend/laravel
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run isolated database tests
        working-directory: backend/laravel
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          SESSION_DRIVER: array
          CACHE_STORE: array
        run: php artisan test

  frontend-build:
    name: React production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  postgres-integration:
    name: Isolated PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stayledger_ci
          POSTGRES_PASSWORD: local-ci-password-only
          POSTGRES_DB: stayledger_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stayledger_ci -d stayledger_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: stayledger_ci
      DB_USERNAME: stayledger_ci
      DB_PASSWORD: local-ci-password-only
      DB_SSLMODE: disable
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      DB_URL: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, curl, xml, pdo_sqlite, sqlite3, pdo_pgsql, pgsql
          tools: composer:v2
          coverage: none
      - name: Install Laravel dependencies
        working-directory: backend/laravel
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Create test application key
        working-directory: backend/laravel
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Confirm isolated database target
        run: |
          test "$DB_HOST" = "127.0.0.1"
          test "$DB_DATABASE" = "stayledger_ci"
      - name: Run Laravel feature tests with PostgreSQL 16
        working-directory: backend/laravel
        run: php artisan test
      - name: Inspect shared users schema read-only
        working-directory: backend/laravel
        run: php artisan stayledger:inspect-shared-users
